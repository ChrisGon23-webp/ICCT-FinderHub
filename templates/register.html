{% extends 'base.html' %}{% block title %}Create account · ICCT FinderHub{% endblock %}{% block content %}<div class="panel mx-auto max-w-xl p-6 sm:p-9"><span class="text-xs font-bold uppercase tracking-widest text-indigo-600">Student account</span><h1 class="mt-2 text-3xl font-bold">Create your account</h1><p class="mt-2 text-sm text-slate-500">New accounts receive the student role by default.</p><form method="post" class="mt-6 space-y-4"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div><label class="mb-1 block text-sm font-semibold">Full name</label><input class="field" name="full_name" maxlength="120" autocomplete="name" required></div><div><label class="mb-1 block text-sm font-semibold">Email address</label><input class="field" type="email" name="email" autocomplete="email" required></div><div><label class="mb-1 block text-sm font-semibold">Password (at least 8 characters)</label><input class="field" type="password" name="password" minlength="8" autocomplete="new-password" required></div><button class="btn btn-primary w-full" type="submit">Create account</button></form><p class="mt-5 text-sm text-slate-500">Already registered? <a class="font-semibold text-indigo-700" href="{{ url_for('login') }}">Sign in</a></p></div>{% endblock %}
